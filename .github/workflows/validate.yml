name: validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py
      - run: python tools/smoke_install.py --root . --temp-root "${{ runner.temp }}" --output "${{ runner.temp }}/hy-text-install-smoke.json"
